# What the `pipeline` program needs to work on this repository. The steps' order stays in code.

[build]
install = ["pnpm", "install", "--frozen-lockfile"]
checks = [["pnpm", "typecheck"], ["pnpm", "lint"], ["pnpm", "test"]]

[test_writer]
includes = ["**/*.test.ts"]
run = ["pnpm", "exec", "vitest", "run", "--reporter=json", "--outputFile={out}"]

[mutation]
tests = ["pnpm", "test"]
typecheck = ["pnpm", "typecheck"]

[review]
# A change under one of these gets a governance review as well as the code review.
governed = [".fabrika/", ".github/", "AGENTS.md", "docs/direction/", "layer-rules.json", "oxlint-plugins/"]

[checks]
# GitHub's CI runs the whole suite. The two here are the quick ones, at each head.
github = "every"

[[checks.run]]
name = "typecheck"
run = ["pnpm", "typecheck"]

[[checks.run]]
name = "lint"
run = ["pnpm", "lint"]

[ship]
# The yes to merge is a person's answer on the ticket. This repository has no CODEOWNERS.
approval = "none"
