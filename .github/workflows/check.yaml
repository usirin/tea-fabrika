name: check

on:
  # A pull request runs once, on its own event. A push runs only on main, for
  # what lands there without one. Both on every branch ran each pull request
  # twice, the same check side by side.
  push:
    branches:
      - main
  # A draft runs only the fast jobs; marking it ready (`ready_for_review`) starts the full set on
  # the same head (changes.mjs's `jobs`, 0134's amendment of 2026-11-11).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub's merge queue tests each group on a temporary branch and takes a required check only from
  # this event. It picks its jobs from the group's changed paths, as a ready pull request does
  # (0174), and so does a push to main, from what that push brought (0175). The group's own base and head give those paths
  # (see BASE below).
  merge_group:
    types: [checks_requested]

# A newer push to the same pull request stops the run it replaces. Main's runs
# all finish, one per commit. Only a new head cancels: the run that marking ready starts waits for
# the draft run on the same head to end, so no check of that head is left canceled.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# Every job has a time limit, so a stuck step fails instead of holding a pull request for the 360
# minute default (pull request 696, ticket 496). The four set with ticket 496 are about twice the
# slowest of that job's last 20 green runs on 2026-11-10 UTC, and at least 5: changes 39 s,
# field 43 s, check 166 s, test 944 s. e2e (333 s) had its own before. next has one per shard,
# sized at its job.
# workflow-lint.ts fails a job without one.
jobs:
  # Today's CI, both versions. One no-install classifier holds every path rule.
  # Safe Markdown and direct field JSONL skip the heavy jobs, on a pull request, in the merge queue
  # and on a push to main; unknown paths run the rest. History that cannot be read runs everything.
  # Today's own checks (its tests, e2e, the promises gate and the build) start only when a file of
  # today's version changed, on every event: the `today`, `e2e` and `build` outputs (0175).
  # A change only to experiments/ runs check alone, and one only to .agents/skills/ skips next:
  # no next/ test reads either. experiments/177-themes/schemes/, which a test reads, runs as an
  # unknown path does.
  # These small checks still run when pnpm setup and the heavy jobs skip.
  # `filter` is the next job's path: the next/ tests that read source as text, lint it or bundle
  # it, when only lint rule files changed or every next/ file is the same program with other
  # comments; else all of next/. The parser's pass (`same`) proves the second case. It runs only when
  # every changed line looks like a comment (`probe`), and its install and run may fail without
  # failing changes: then the first pass's `next` and `filter` stand, which run all of next/.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.diff.outputs.check }}
      typecheck: ${{ steps.diff.outputs.typecheck }}
      test: ${{ steps.diff.outputs.test }}
      next: ${{ steps.same.outputs.next || steps.diff.outputs.next }}
      filter: ${{ steps.same.outputs.filter || steps.diff.outputs.filter }}
      e2e: ${{ steps.diff.outputs.e2e }}
      field: ${{ steps.diff.outputs.field }}
      build: ${{ steps.diff.outputs.build }}
      today: ${{ steps.diff.outputs.today }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/ci/changes.mjs
      - run: sh .agents/skills/lead/scripts/skillscheck.sh
        if: ${{ !cancelled() }}
      - run: node oxlint-plugins/gitignore.mjs
        if: ${{ !cancelled() }}
      # The parser for the `--same` pass, with the field job's filtered install, about 15 s.
      - uses: pnpm/action-setup@v6
        if: steps.diff.outputs.probe == 'true'
        continue-on-error: true
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.diff.outputs.probe == 'true'
        continue-on-error: true
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile --filter @tea-fabrika/ci --ignore-scripts
        if: steps.diff.outputs.probe == 'true'
        continue-on-error: true
      # One line per candidate file, same program or why not, and the parser's version, in the log
      # and the job summary.
      - id: same
        if: steps.diff.outputs.probe == 'true'
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/ci/changes.mjs --same

  # Start beside changes. No workspace setup for Markdown alone.
  # Filtered install uses the root lockfile and all workspace supply-chain rules.
  # The proof PR measures this path's cold install and cache cost.
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/ci/changes.mjs
      - uses: pnpm/action-setup@v6
        if: steps.diff.outputs.field == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.diff.outputs.field == 'true'
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile --filter @tea-fabrika/ci --ignore-scripts
        if: steps.diff.outputs.field == 'true'
      - run: node .github/ci/field-check.ts
        if: steps.diff.outputs.field == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}

  # On a draft this job is lint alone, and it says so in its name: a draft's `lint` never stands in
  # for the ready run's `check` on the same head, which catchup.sh waits for.
  check:
    name: ${{ github.event.pull_request.draft && 'lint' || 'check' }}
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.check != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `pnpm lint` fails on a dead export the ledger does not name (code-graph 0.12.0:
      # 0 of 4 findings wrong on 2026-10-29). It also prunes entries whose finding is
      # gone; this step fails when that pruned ledger was not committed.
      - name: dead exports ledger committed
        run: git diff --exit-code -- unreachable-ledger.json
      # `.agents/` is held to next/'s rules (0033). `pnpm lint` waives only the findings
      # agents-ledger.json names and prunes the ones that are gone; this step fails when that
      # pruned ledger was not committed, so the ledger only shrinks.
      - name: agents ledger committed
        run: git diff --exit-code -- agents-ledger.json
      # The same for `next/`: what a rule met the day it joined, which only shrinks (ledger.ts).
      - name: next ledger committed
        run: git diff --exit-code -- next-ledger.json
      # Experiment 117: each formal check is tied to the code it covers (promises/).
      # It fails when covered code changed and its record was not confirmed again, when
      # a check is red at this head, or when a planted break is not caught. A change to a
      # check itself is listed for the owner, here and in the step summary.
      - name: promises
        if: ${{ needs.changes.outputs.build != 'false' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BASE"; then
            pnpm promises gate --base "$BASE"
          else
            pnpm promises gate
          fi
      # The builds of @kampus/fabrika-old and @kampus/pipeline (dist/): the published
      # packages. Nothing above needs them.
      - run: pnpm build
        if: ${{ needs.changes.outputs.build != 'false' }}

  # `pnpm typecheck` alone, beside check (0133): it starts at once, a red typecheck no longer hides
  # lint's answer, and a lane reads this one job's conclusion for its head the moment it ends
  # (chain.ts's `typechecking` phase). It runs where check runs, less a change only to
  # experiments/, which the root tsconfig leaves out.
  typecheck:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.typecheck != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # The app end to end (apps/fabrika/e2e.ts): Playwright drives the real built app in Electron.
  # It checks macOS's window rules (the close button keeps the app running, the dock icon brings
  # the window back), so it runs on a macOS runner; on Linux those rules are not there to check.
  # It runs when a file of today's version changed, on a pull request, in the merge queue and on a
  # push to main (0175).
  # No secret and no key: the API keys are never set here. The one download beyond what the other
  # jobs fetch is Electron's own binary, from its GitHub release, kept in the cache after once.
  e2e:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.e2e != 'false') }}
    runs-on: macos-latest
    # 15 for the run, and room for the ARIA stage's own app and its about 35 cells.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      # Electron fetches its binary the first time it is asked for its path, into this folder.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile
      # Each run makes its own fresh FABRIKA_HOME in the temp folder, and stops the hosts it started.
      - name: e2e
        env:
          SHOTS: ${{ runner.temp }}/e2e-shots
        run: pnpm --filter @kampus/fabrika-app-old e2e
      # The trace ruler's labels at widths from 60 to 1600px (apps/fabrika/ruler-e2e.ts): the built
      # renderer in headless Chromium, as shots.ts draws it. The build above made dist/.
      - name: ruler labels
        run: pnpm --filter @kampus/fabrika-app-old exec playwright install chromium && pnpm --filter @kampus/fabrika-app-old exec node ruler-e2e.ts
      # What the window showed at each step, to see a red run without running it again.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
      # The ARIA trees (design language call 8, decided 2026-11-07): each key state at the five
      # layouts, compared with apps/fabrika/aria/. It advises and never blocks: a diff is printed and
      # the step passes, so `continue-on-error` only covers a state it cannot reach (exit 2). It
      # blocks once its false alarms are counted (0 noise in 300 clean checks, 0 flakes).
      - name: aria
        continue-on-error: true
        env:
          SHOTS: ${{ runner.temp }}/e2e-shots
        run: pnpm --filter @kampus/fabrika-app-old e2e -- --aria
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aria-received
          path: ${{ runner.temp }}/e2e-shots/aria-received
          if-no-files-found: ignore

  # T554: lane files run one at a time, before other tests, to avoid CPU crowding.
  # The tests, split by file over six machines (vitest's `--shard`, each machine
  # given about the same seconds by vitest.shards.ts). The lane's tests were one
  # file run in order, 27 min on one machine; as 18 files of 20 to 158 s they ran
  # in 2.9 to 3.9 min a machine (pull request 412's run, experiment 222).
  test:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` compares with the pull request's base commit, so the
          # history must hold it. The whole repository is a few MB.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      # tsh's terminal tests drive it through `expect` (a pty) and from zsh.
      # The runner image has neither, and without them those tests skip.
      # The os sandbox (packages/fabrika/src/sandbox/os.ts) is sandbox-runtime, which on
      # Linux needs bubblewrap, socat and ripgrep, and user namespaces that Ubuntu
      # 24.04 restricts by default (its README says so). On CI its tests never skip.
      # The image has none of the five (image 20261101.360 installs all of them new; its
      # Ubuntu2404-Readme.md and toolset-2404.json list none of them), so apt always runs here.
      # The runner's mirrors sometimes stop answering, and apt then waits with no end: 32 min on
      # pull request 696 (actions/runner-images issue 14594), and on 2026-11-11 every Canonical
      # host at once (issues 15296, 15297). apt.sh gives each try a wall-clock limit and, after a
      # failed try, drops the top mirror, walking a chain of six that ends outside Canonical. Its
      # comment holds the measured limits; the cause is outside this repo (decision 0036). Three
      # dead mirrors, then a full install, take about 8 min, inside the step's 12.
      # `ubuntu-latest` is Ubuntu 26.04 for this repository since it moved to the organization on
      # 2026-11-13 (24.04 on every job before the move, 26.04 on every job after). That image has
      # bubblewrap already, with an AppArmor profile of its own, `bwrap-userns-restrict`: what bwrap
      # starts runs as `unpriv_bwrap`, which denies every capability. sandbox-runtime's seccomp
      # helper needs CAP_SYS_ADMIN in the user namespace it makes inside the box, so every box ended
      # with exit 1 before its program started: "apply-seccomp: write /proc/self/setgroups (nested
      # userns is capability-restricted; caller must provide CAP_SYS_ADMIN): Permission denied" (run
      # 43493167395, test (1): refused before the unload, ran after it). The sysctl does not reach a
      # named profile, and a `deny` in a profile cannot be allowed back from a local file, so the
      # profile is unloaded where the image has it. 24.04 has none.
      - name: apt packages
        timeout-minutes: 12
        run: |
          sudo sh .github/ci/apt.sh install expect zsh bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - run: pnpm install --frozen-lockfile
      # Today's tests run only when a file of today's version changed (changes' `today` flag, 0175);
      # otherwise the last test step runs the tooling tests alone.
      # BASE is the commit the run's change starts from: a pull request's base, a merge queue group's
      # base, or what main held before a push. It is empty when there is none (a first push, whose
      # `before` is all zeros, or a run started by hand), and then every test runs.
      # With a BASE, a run runs the tests that import what it
      # changed (vitest's `--changed`, its config's `forceRerunTriggers` for files
      # tests read without importing), then, on the first machine, the tests that
      # read the whole repo themselves, which an import walk never picks: the
      # app's bundles, and the law that every machine has laws.
      - name: lane tests, one file at a time
        if: ${{ needs.changes.outputs.today != 'false' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          SHARD: ${{ matrix.shard }}/6
        run: |
          if [ -n "$BASE" ]; then
            pnpm exec vitest run packages/pipeline/src/stages/pipeline/lane. --changed "$BASE" --shard "$SHARD" --passWithNoTests --maxWorkers=1 --exclude 'next/**' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/lanes.json"
          else
            pnpm exec vitest run packages/pipeline/src/stages/pipeline/lane. --shard "$SHARD" --passWithNoTests --maxWorkers=1 --exclude 'next/**' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/lanes.json"
          fi
      - name: test
        if: ${{ !cancelled() && needs.changes.outputs.today != 'false' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          SHARD: ${{ matrix.shard }}/6
        run: |
          if [ -n "$BASE" ]; then
            pnpm exec vitest run --changed "$BASE" --shard "$SHARD" --passWithNoTests --exclude 'next/**' --exclude apps/fabrika/src/bundles.test.ts --exclude packages/pipeline/src/laws/standard.test.ts --exclude 'packages/pipeline/src/stages/pipeline/lane.*.test.ts' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/rest.json"
            if [ "${{ matrix.shard }}" = 1 ]; then
              pnpm exec vitest run apps/fabrika/src/bundles.test.ts packages/pipeline/src/laws/standard.test.ts --exclude 'next/**' --exclude 'packages/pipeline/src/stages/pipeline/lane.*.test.ts' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/forced.json"
            fi
          else
            pnpm exec vitest run --shard "$SHARD" --exclude 'next/**' --exclude 'packages/pipeline/src/stages/pipeline/lane.*.test.ts' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/rest.json"
          fi
      # The tests that belong to neither version's product code: CI's own (.github/ci), the lint
      # plugins, the root scripts and the skill scripts. With no file of today's version changed
      # they run alone: every test vitest.config.ts includes, less the three trees of today's tests
      # and next/. With a BASE the ones that reach the change run; with none, all of them.
      - name: tooling tests
        if: ${{ !cancelled() && needs.changes.outputs.today == 'false' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          SHARD: ${{ matrix.shard }}/6
        run: |
          if [ -n "$BASE" ]; then
            pnpm exec vitest run --changed "$BASE" --shard "$SHARD" --passWithNoTests --exclude 'next/**' --exclude 'apps/**' --exclude 'packages/**' --exclude 'programs/**' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/tooling.json"
          else
            pnpm exec vitest run --shard "$SHARD" --passWithNoTests --exclude 'next/**' --exclude 'apps/**' --exclude 'packages/**' --exclude 'programs/**' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/tooling.json"
          fi
      - name: shard times
        if: ${{ !cancelled() }}
        run: node .github/ci/shard-times.ts "$RUNNER_TEMP/lanes.json" "$RUNNER_TEMP/rest.json" "$RUNNER_TEMP/forced.json" "$RUNNER_TEMP/tooling.json"

  # next/, the new version (docs/plan/tier-1.md). Every test under next/ runs when affected, or only
  # the reader tests when changes' `filter` names them (the plan for CI paths, slice 2). The exam's
  # tests read files and the later ones start a brain, so `--changed` in the test job, which follows
  # imports, would not pick them up. Then the thin runner over next/apps/fabrika/e2e/,
  # which passes while that folder is empty. Chromium is fetched only once an e2e file exists, by
  # the app's own Playwright. Electron and launchd run on the laptop first; CI gets Electron once
  # xvfb and the keychain are tried.
  next:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.next != 'false') }}
    runs-on: ubuntu-latest
    # Largest of 30 completed next jobs: 486 s, run 43239450301 attempt 1, job 131255816934.
    # Twice that whole-job time, rounded up to a minute: ceil(972 / 60) = 17.
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          # The edges step compares the pull request with its merge base, so the history must hold
          # it. The whole repository is a few MB.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # FILTER is unquoted, so each reader path is its own argument. A missing filter runs all of next/.
      - run: pnpm exec vitest run $FILTER --shard "$SHARD" --reporter=verbose --reporter=json --reporter=github-actions --outputFile.json="$RUNNER_TEMP/next.json"
        env:
          SHARD: ${{ matrix.shard }}/6
          FILTER: ${{ needs.changes.outputs.filter || 'next/' }}
      - name: shard times
        if: ${{ !cancelled() }}
        run: node .github/ci/shard-times.ts "$RUNNER_TEMP/next.json"
      # `--with-deps` runs apt itself, with no limit. apt.sh refreshes the lists first, on a mirror
      # that answers, the same way as the test job's apt step.
      - name: chromium
        if: matrix.shard == 1 && hashFiles('next/apps/fabrika/e2e/*.test.ts') != ''
        run: |
          sudo sh .github/ci/apt.sh update
          pnpm --filter @kampus/fabrika exec playwright install --with-deps chromium
      - run: node next/apps/fabrika/e2e.ts
        if: matrix.shard == 1
      # Tier 1, P35: each edge comment this pull request adds, one line with its reason, for the owner
      # (docs/direction/no-promises.md). In the step summary and as a note on that line of the diff.
      # It never blocks on an edge: it exits 0, or 2 only when it could not read a file.
      - name: edges
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node next/apps/fabrika/src/exam/edges.ts --base "$BASE"

  # The one check from this workflow that GitHub's ruleset for main requires, so a merge made outside
  # catchup.sh is refused while a job above is red. The same name and shape as phoenix's (its ci.yml
  # and decisions 0061, 0092 and 0404). It needs every other job here, and runs even when one failed
  # or the run was canceled: a skipped required check counts as passed on GitHub, so this job never
  # skips. required.mjs passes a job's skip only when changes said that job need not run, from the
  # same output its `if:` reads.
  # No install and no setup: the runner's own Node runs required.mjs, as it runs changes.mjs.
  # On a draft it is named `ci-required (draft)`: GitHub makes a job's check run only when its needs
  # end, so for the whole ready run the draft's green `ci-required` on the same head would be the
  # latest one and would satisfy the ruleset. Under its own name it never does; a draft cannot
  # merge anyway.
  ci-required:
    name: ${{ github.event.pull_request.draft && 'ci-required (draft)' || 'ci-required' }}
    needs: [changes, field, check, typecheck, e2e, test, next]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/ci/required.mjs
