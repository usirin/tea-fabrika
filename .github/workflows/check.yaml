name: check

on:
  # A pull request runs once, on its own event. A push runs only on main, for
  # what lands there without one. Both on every branch ran each pull request
  # twice, the same check side by side.
  push:
    branches:
      - main
  pull_request:

# A newer push to the same pull request stops the run it replaces. Main's runs
# all finish, one per commit.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a time limit, so a stuck step fails instead of holding a pull request for the 360
# minute default (pull request 696, ticket 496). The four set with ticket 496 are about twice the
# slowest of that job's last 20 green runs on 2026-11-10 UTC, and at least 5: changes 39 s,
# field 43 s, check 166 s, test 944 s. next (674 s) and e2e (333 s) had theirs before.
# workflow-lint.ts fails a job without one.
jobs:
  # Today's CI, both versions. One no-install classifier holds every path rule.
  # Safe Markdown and direct field JSONL skip the heavy jobs; unknown paths and main run all.
  # These small checks still run when pnpm setup and the heavy jobs skip.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.diff.outputs.check }}
      test: ${{ steps.diff.outputs.test }}
      next: ${{ steps.diff.outputs.next }}
      e2e: ${{ steps.diff.outputs.e2e }}
      field: ${{ steps.diff.outputs.field }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: node .github/ci/changes.mjs
      - run: sh .agents/skills/lead/scripts/skillscheck.sh
        if: ${{ !cancelled() }}
      - run: node oxlint-plugins/gitignore.mjs
        if: ${{ !cancelled() }}

  # Start beside changes and commits. No workspace setup for Markdown alone.
  # Filtered install uses the root lockfile and all workspace supply-chain rules.
  # The proof PR measures this path's cold install and cache cost.
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: node .github/ci/changes.mjs
      - uses: pnpm/action-setup@v6
        if: steps.diff.outputs.field == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.diff.outputs.field == 'true'
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile --filter @tea-fabrika/ci --ignore-scripts
        if: steps.diff.outputs.field == 'true'
      - run: node .github/ci/field-check.ts
        if: steps.diff.outputs.field == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}

  check:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.check != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # `pnpm lint` fails on a dead export the ledger does not name (code-graph 0.12.0:
      # 0 of 4 findings wrong on 2026-10-29). It also prunes entries whose finding is
      # gone; this step fails when that pruned ledger was not committed.
      - name: dead exports ledger committed
        run: git diff --exit-code -- unreachable-ledger.json
      # Experiment 117: each formal check is tied to the code it covers (promises/).
      # It fails when covered code changed and its record was not confirmed again, when
      # a check is red at this head, or when a planted break is not caught. A change to a
      # check itself is listed for the owner, here and in the step summary.
      - name: promises
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BASE"; then
            pnpm promises gate --base "$BASE"
          else
            pnpm promises gate
          fi
      # The builds of @kampus/fabrika-old and @kampus/pipeline (dist/): the published
      # packages. Nothing above needs them.
      - run: pnpm build

  # The app end to end (apps/fabrika/e2e.ts): Playwright drives the real built app in Electron.
  # It checks macOS's window rules (the close button keeps the app running, the dock icon brings
  # the window back), so it runs on a macOS runner; on Linux those rules are not there to check.
  # Every pull request and every push to main runs it: off CI, main went red and nobody saw.
  # No secret and no key: the API keys are never set here. The one download beyond what the other
  # jobs fetch is Electron's own binary, from its GitHub release, kept in the cache after once.
  e2e:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.e2e != 'false') }}
    runs-on: macos-latest
    # 15 for the run, and room for the ARIA stage's own app and its about 35 cells.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      # Electron fetches its binary the first time it is asked for its path, into this folder.
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile
      # Each run makes its own fresh FABRIKA_HOME in the temp folder, and stops the hosts it started.
      - name: e2e
        env:
          SHOTS: ${{ runner.temp }}/e2e-shots
        run: pnpm --filter @kampus/fabrika-app-old e2e
      # The trace ruler's labels at widths from 60 to 1600px (apps/fabrika/ruler-e2e.ts): the built
      # renderer in headless Chromium, as shots.ts draws it. The build above made dist/.
      - name: ruler labels
        run: pnpm --filter @kampus/fabrika-app-old exec playwright install chromium && pnpm --filter @kampus/fabrika-app-old exec node ruler-e2e.ts
      # What the window showed at each step, to see a red run without running it again.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
      # The ARIA trees (design language call 8, decided 2026-11-07): each key state at the five
      # layouts, compared with apps/fabrika/aria/. It advises and never blocks: a diff is printed and
      # the step passes, so `continue-on-error` only covers a state it cannot reach (exit 2). It
      # blocks once its false alarms are counted (0 noise in 300 clean checks, 0 flakes).
      - name: aria
        continue-on-error: true
        env:
          SHOTS: ${{ runner.temp }}/e2e-shots
        run: pnpm --filter @kampus/fabrika-app-old e2e -- --aria
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aria-received
          path: ${{ runner.temp }}/e2e-shots/aria-received
          if-no-files-found: ignore

  # The tests, split by file over six machines (vitest's `--shard`, each machine
  # given about the same seconds by vitest.shards.ts). The lane's tests were one
  # file run in order, 27 min on one machine; as 18 files of 20 to 158 s they ran
  # in 2.9 to 3.9 min a machine (pull request 412's run, experiment 222).
  test:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` compares with the pull request's base commit, so the
          # history must hold it. The whole repository is a few MB.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      # tsh's terminal tests drive it through `expect` (a pty) and from zsh.
      # The runner image has neither, and without them those tests skip.
      # The os sandbox (packages/fabrika/src/sandbox/os.ts) is sandbox-runtime, which on
      # Linux needs bubblewrap, socat and ripgrep, and user namespaces that Ubuntu
      # 24.04 restricts by default (its README says so). On CI its tests never skip.
      # The image has none of the five (image 20261101.360 installs all of them new).
      # The runner's Azure mirror sometimes stops answering, and apt then waits with no end: 32 min
      # on pull request 696, with the image's own apt limits set (Acquire::Retries 1, a 15 s
      # timeout; actions/runner-images issue 14594). So each apt command gets a wall-clock limit
      # and three tries; the cause is outside this repo (decision 0036). In 432 green jobs the
      # step took at most 246 s; in the six slowest, `update` fetched in at most 16 s and `install`
      # in at most 237 s.
      - name: apt packages
        timeout-minutes: 12
        run: |
          bounded() {
            limit=$1
            shift
            for try in 1 2 3; do
              sudo timeout --kill-after=10 "$limit" apt-get "$@" && return 0
              echo "::warning::apt-get $1 failed or passed ${limit} s, try $try of 3"
            done
            return 1
          }
          bounded 60 update
          bounded 300 install -y --no-install-recommends expect zsh bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile
      # Main runs every test. A pull request runs the tests that import what it
      # changed (vitest's `--changed`, its config's `forceRerunTriggers` for files
      # tests read without importing), then, on the first machine, the tests that
      # read the whole repo themselves, which an import walk never picks: the
      # app's bundles, and the law that every machine has laws. Main's run catches
      # what a pull request's run could not see, one merge late.
      - name: test
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}/6
        run: |
          if [ -n "$BASE" ]; then
            pnpm exec vitest run --changed "$BASE" --shard "$SHARD" --passWithNoTests --exclude 'next/**' --exclude apps/fabrika/src/bundles.test.ts --exclude packages/pipeline/src/laws/standard.test.ts
            if [ "${{ matrix.shard }}" = 1 ]; then
              pnpm exec vitest run apps/fabrika/src/bundles.test.ts packages/pipeline/src/laws/standard.test.ts --exclude 'next/**'
            fi
          else
            pnpm exec vitest run --shard "$SHARD" --exclude 'next/**'
          fi

  # next/, the new version (docs/plan/tier-1.md). Every test under next/ runs when affected:
  # the exam's tests read files and the later ones start a brain, so `--changed` in the test job,
  # which follows imports, would not pick them up. Then the thin runner over next/apps/fabrika/e2e/,
  # which passes while that folder is empty. Chromium is fetched only once an e2e file exists, by
  # the app's own Playwright. Electron and launchd run on the laptop first; CI gets Electron once
  # xvfb and the keychain are tried.
  next:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.next != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The edges step compares the pull request with its merge base, so the history must hold
          # it. The whole repository is a few MB.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run next/
      - name: chromium
        if: hashFiles('next/apps/fabrika/e2e/*.test.ts') != ''
        run: pnpm --filter @kampus/fabrika exec playwright install --with-deps chromium
      - run: node next/apps/fabrika/e2e.ts
      # Tier 1, P35: each edge comment this pull request adds, one line with its reason, for the owner
      # (docs/direction/no-promises.md). In the step summary and as a note on that line of the diff.
      # It never blocks on an edge: it exits 0, or 2 only when it could not read a file.
      - name: edges
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node next/apps/fabrika/src/exam/edges.ts --base "$BASE"
