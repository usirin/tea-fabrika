name: check

on:
  # `**`, not `*`: a branch filter's `*` matches one path segment, so it never
  # matches `umut/some-branch`.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm

      # tsh's terminal tests drive it through `expect` (a pty) and from zsh.
      # The runner image has neither, and without them those tests skip.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends expect zsh

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The builds of @kampus/fabrika and @kampus/pipeline (dist/): the published
      # packages. Nothing above needs them.
      - run: pnpm build
