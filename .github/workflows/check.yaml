name: check

on:
  # `**`, not `*`: a branch filter's `*` matches one path segment, so it never
  # matches `umut/some-branch`.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.2.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
