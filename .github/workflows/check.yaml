name: check

on:
  # A pull request runs once, on its own event. A push runs only on main, for
  # what lands there without one. Both on every branch ran each pull request
  # twice, the same check side by side.
  push:
    branches:
      - main
  # A draft runs only the fast jobs; marking it ready (`ready_for_review`) starts the full set on
  # the same head (changes.mjs's `jobs`, 0134's amendment of 2026-11-11).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # GitHub's merge queue tests each group on a temporary branch and takes a required check only from
  # this event. It picks its jobs from the group's changed paths, as a ready pull request does
  # (0174), and so does a push to main, from what that push brought (0175). The group's own base and head give those paths
  # (see BASE below).
  merge_group:
    types: [checks_requested]

# A newer push to the same pull request stops the run it replaces. Main's runs
# all finish, one per commit. Only a new head cancels: the run that marking ready starts waits for
# the draft run on the same head to end, so no check of that head is left canceled.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# Every job has a time limit, so a stuck step fails instead of holding a pull request for the 360
# minute default (pull request 696, ticket 496). The four set with ticket 496 are about twice the
# slowest of that job's last 20 green runs on 2026-11-10 UTC, and at least 5: changes 39 s,
# field 43 s, check 166 s, test 944 s. e2e (333 s) had its own before. next has one per shard,
# sized at its job.
# workflow-lint.ts fails a job without one.
jobs:
  # One no-install classifier holds every path rule.
  # Safe Markdown and direct field JSONL skip the heavy jobs, on a pull request, in the merge queue
  # and on a push to main; unknown paths run the rest. History that cannot be read runs everything.
  # Today's version is frozen (0525): no job runs for it, and `e2e`, its end-to-end tests, is off.
  # These small checks still run when pnpm setup and the heavy jobs skip.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.diff.outputs.check }}
      typecheck: ${{ steps.diff.outputs.typecheck }}
      test: ${{ steps.diff.outputs.test }}
      next: ${{ steps.diff.outputs.next }}
      e2e: ${{ steps.diff.outputs.e2e }}
      field: ${{ steps.diff.outputs.field }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/ci/changes.mjs
      - run: sh .agents/skills/lead/scripts/skillscheck.sh
        if: ${{ !cancelled() }}
      - run: node oxlint-plugins/gitignore.mjs
        if: ${{ !cancelled() }}
      # The freeze guard (0525): a change may delete a file of today's version, never add or change
      # one. It reads the same diff as the classifier, so its BASE, HEAD and EVENT are the same.
      - run: node .github/ci/freeze.mjs
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}

  # Start beside changes. No workspace setup for Markdown alone.
  # Filtered install uses the root lockfile and all workspace supply-chain rules.
  # The proof PR measures this path's cold install and cache cost.
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/ci/changes.mjs
      - uses: pnpm/action-setup@v6
        if: steps.diff.outputs.field == 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v7
        if: steps.diff.outputs.field == 'true'
        with:
          node-version: 26.13.0
      - run: pnpm install --frozen-lockfile --filter @tea-fabrika/ci --ignore-scripts
        if: steps.diff.outputs.field == 'true'
      - run: node .github/ci/field-check.ts
        if: steps.diff.outputs.field == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}

  # On a draft this job is lint alone, and it says so in its name: a draft's `lint` never stands in
  # for the ready run's `check` on the same head, which catchup.sh waits for.
  check:
    name: ${{ github.event.pull_request.draft && 'lint' || 'check' }}
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.check != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # `pnpm lint` fails on any dead export outside today's frozen version (dead.ts, 0524).
      - run: pnpm lint
      # `.agents/` is held to next/'s rules (0033). `pnpm lint` waives only the findings
      # agents-ledger.json names and prunes the ones that are gone; this step fails when that
      # pruned ledger was not committed, so the ledger only shrinks.
      - name: agents ledger committed
        run: git diff --exit-code -- agents-ledger.json
      # The same for `next/`: what a rule met the day it joined, which only shrinks (ledger.ts).
      - name: next ledger committed
        run: git diff --exit-code -- next-ledger.json

  # `pnpm typecheck` alone, beside check (0133): it starts at once, a red typecheck no longer hides
  # lint's answer, and a lane reads this one job's conclusion for its head the moment it ends
  # (chain.ts's `typechecking` phase). It runs where check runs: changes gives it check's flag.
  typecheck:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.typecheck != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Today's end-to-end tests are removed with today's version (0525). The job keeps its name, since
  # ci-required names it, and its flag is false for every input, so it skips wherever changes
  # succeeds. It runs only when changes failed, and ci-required fails then anyway.
  e2e:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: e2e
        run: |
          echo "today's end-to-end tests are removed (0525); this job runs only when changes failed"
          exit 1

  # The tests, split by file over six machines (vitest's `--shard`, each machine given about the
  # same seconds by vitest.shards.ts): CI's own (.github/ci), the lint plugins, the root scripts, the
  # skill scripts and the design package's laws. next/ has its own job, and today's version has no
  # tests (0525).
  test:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.test != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` compares with the pull request's base commit, so the
          # history must hold it. The whole repository is a few MB.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # BASE is the commit the run's change starts from: a pull request's base, a merge queue group's
      # base, or what main held before a push. It is empty when there is none (a first push, whose
      # `before` is all zeros, or a run started by hand), and then every test runs. With a BASE, a
      # run runs the tests that import what it changed (vitest's `--changed`, its config's
      # `forceRerunTriggers` for files tests read without importing).
      - name: test
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
          SHARD: ${{ matrix.shard }}/6
        run: |
          if [ -n "$BASE" ]; then
            pnpm exec vitest run --changed "$BASE" --shard "$SHARD" --passWithNoTests --exclude 'next/**' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/test.json"
          else
            pnpm exec vitest run --shard "$SHARD" --passWithNoTests --exclude 'next/**' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/test.json"
          fi
      - name: shard times
        if: ${{ !cancelled() }}
        run: node .github/ci/shard-times.ts "$RUNNER_TEMP/test.json"

  # next/, the new version (docs/plan/tier-1.md). Every test under next/ runs when affected:
  # the exam's tests read files and the later ones start a brain, so `--changed` in the test job,
  # which follows imports, would not pick them up. Then the thin runner over next/apps/fabrika/e2e/,
  # which passes while that folder is empty. Chromium is fetched only once an e2e file exists, by
  # the app's own Playwright. Electron and launchd run on the laptop first; CI gets Electron once
  # xvfb and the keychain are tried.
  next:
    needs: changes
    if: >-
      ${{ !cancelled() &&
          (needs.changes.result != 'success' ||
           needs.changes.outputs.next != 'false') }}
    runs-on: ubuntu-latest
    # Largest of 30 completed next jobs: 486 s, run 43239450301 attempt 1, job 131255816934.
    # Twice that whole-job time, rounded up to a minute: ceil(972 / 60) = 17.
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          # The edges step compares the pull request with its merge base, so the history must hold
          # it. The whole repository is a few MB.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run next/ --shard "$SHARD" --reporter=verbose --reporter=json --reporter=github-actions --outputFile.json="$RUNNER_TEMP/next.json"
        env:
          SHARD: ${{ matrix.shard }}/6
      - name: shard times
        if: ${{ !cancelled() }}
        run: node .github/ci/shard-times.ts "$RUNNER_TEMP/next.json"
      # `--with-deps` runs apt itself, with no limit. apt.sh refreshes the lists first, on a mirror
      # that answers.
      - name: chromium
        if: matrix.shard == 1 && hashFiles('next/apps/fabrika/e2e/*.test.ts') != ''
        run: |
          sudo sh .github/ci/apt.sh update
          pnpm --filter @kampus/fabrika exec playwright install --with-deps chromium
      - run: node next/apps/fabrika/e2e.ts
        if: matrix.shard == 1
      # Tier 1, P35: each edge comment this pull request adds, one line with its reason, for the owner
      # (docs/direction/no-promises.md). In the step summary and as a note on that line of the diff.
      # It never blocks on an edge: it exits 0, or 2 only when it could not read a file.
      - name: edges
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node next/apps/fabrika/src/exam/edges.ts --base "$BASE"

  # The one check from this workflow that GitHub's ruleset for main requires, so a merge made outside
  # catchup.sh is refused while a job above is red. The same name and shape as phoenix's (its ci.yml
  # and decisions 0061, 0092 and 0404). It needs every other job here, and runs even when one failed
  # or the run was canceled: a skipped required check counts as passed on GitHub, so this job never
  # skips. required.mjs passes a job's skip only when changes said that job need not run, from the
  # same output its `if:` reads.
  # No install and no setup: the runner's own Node runs required.mjs, as it runs changes.mjs.
  # On a draft it is named `ci-required (draft)`: GitHub makes a job's check run only when its needs
  # end, so for the whole ready run the draft's green `ci-required` on the same head would be the
  # latest one and would satisfy the ruleset. Under its own name it never does; a draft cannot
  # merge anyway.
  ci-required:
    name: ${{ github.event.pull_request.draft && 'ci-required (draft)' || 'ci-required' }}
    needs: [changes, field, check, typecheck, e2e, test, next]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/ci/required.mjs
