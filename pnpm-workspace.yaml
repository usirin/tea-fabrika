# packages: what other code may build on. programs: one runnable tea program each.
# wip: everything not yet pulled out. legacy: the first-generation factory.
# packs: add-on packs, wired to the core by one config line; the core names none.
# docs/tutorials: a tutorial's finished files, type-checked so it cannot drift.
# apps: what a person opens, on top of everything else. Nothing imports an app.
# experiments/142-web-terminals: one experiment's harness, so its terminal libraries stay out of the app.
# experiments/171-alchemy-local-twin: one experiment's harness, so it imports the ledger server's stack by name.
packages:
  - apps/*
  - packages/*
  - programs/*
  - packs/*
  - docs/tutorials/*
  - wip
  - legacy
  - experiments/142-web-terminals
  - experiments/171-alchemy-local-twin

catalog:
  '@agentclientprotocol/sdk': 1.6.1
  # The ledger server's deploy (packages/ledger-server), held exact: a beta, as experiments 144 and 147 ran it.
