# packages: what other code may build on. programs: one runnable tea program each.
# wip: everything not yet pulled out. legacy: the first-generation factory.
# packs: add-on packs, wired to the core by one config line; the core names none.
# docs/tutorials: a tutorial's finished files, type-checked so it cannot drift.
# apps: what a person opens, on top of everything else. Nothing imports an app.
# experiments/142-web-terminals: one experiment's harness, so its terminal libraries stay out of the app.
# experiments/171-alchemy-local-twin: one experiment's harness, so it imports the ledger server's stack by name.
# experiments/173-worker-loader: one experiment's harness, so it bundles a program with esbuild for Worker Loader.
# oxlint-plugins: this repo's own lint rules, type-checked and tested like the rest.
packages:
  - apps/*
  - packages/*
  - programs/*
  - packs/*
  - docs/tutorials/*
  - oxlint-plugins
  - wip
  - legacy
  - experiments/142-web-terminals
  - experiments/171-alchemy-local-twin
  - experiments/173-worker-loader

catalog:
  '@agentclientprotocol/sdk': 1.6.1
  # The ledger server's deploy (packages/ledger-server), held exact: a beta, as experiments 144 and 147 ran it.
  '@alchemy.run/cloudflare': 2.0.0-beta.84
  alchemy: 2.0.0-beta.84
  '@anthropic-ai/claude-agent-sdk': 0.3.296
  # The os sandbox (packages/fabrika/src/sandbox/os.ts), held exact: 0.0.x, as experiments 127, 128 and 137 ran it.
  '@anthropic-ai/sandbox-runtime': 0.0.81
  '@demlik/code-graph': 0.12.0
  '@demlik/structure-sweep': 0.3.9
  '@demlik/tea': 0.21.0
  '@effect/opentelemetry': 4.1.1
  '@effect/platform-node': 4.1.1
  '@effect/tsgo': 0.63.0
  '@effect/vitest': 4.1.1
  # MCP's official TypeScript SDK, v2's split packages: the host serves programs as tools (@kampus/fabrika-old/mcp).
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/server': 2.4.0
  # The app's UI (apps/fabrika, programs/*/window): Manti UI, Zag.js state machines and a token
  # contract of CSS custom properties, set from our own values (docs/direction/ui-on-manti.md).
  # MIT. Held exact: 0.x, a minor can break.
  '@manti-ui/react': 0.13.0
  '@manti-ui/styles': 0.13.0
  # Lint and format (docs/direction/oxlint-and-oxfmt.md). Held exact: oxlint's JS plugins are alpha,
  # oxfmt is 0.x, and a new version can change what fires or how a file prints.
  oxfmt: 0.75.0
  oxlint: 1.90.0
  '@oxlint/plugins': 1.90.0
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/exporter-trace-otlp-http': 0.222.0
  '@opentelemetry/resources': 2.11.0
  '@opentelemetry/sdk-trace-base': 2.11.0
  # The markdown window's code colors (programs/markdown): Pierre's highlighter, its lexers in one
  # WebAssembly module. Apache-2.0, its themes MIT or Apache-2.0. Held exact: a beta.
  '@pierre/highlights': 0.3.0
  '@rslib/core': 1.0.5
  # The mutation step (packages/pipeline/src/stages/mutation), held exact: experiment 124 ran 10.1.1.
  '@stryker-mutator/core': 10.1.1
  '@stryker-mutator/instrumenter': 10.1.1
  '@stryker-mutator/vitest-runner': 10.1.1
  # Follows the major of the Node we run (`volta` in package.json, 26), not npm's latest. Electron's main
  # process runs its own Node, older than that (docs/direction/the-gui-is-electron-first.md).
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # Experiment 142's other terminals (experiments/142-web-terminals), held exact like ghostty-web.
  # wterm, Apache-2.0, a Vercel Labs experiment: rows in the DOM, libghostty's core opt-in.
  '@wterm/dom': 0.5.7
  '@wterm/ghostty': 0.5.7
  # xterm.js, MIT, VS Code's terminal, with its fit and WebGL addons.
  '@xterm/addon-fit': 0.11.0
  '@xterm/addon-webgl': 0.19.0
  '@xterm/xterm': 6.0.0
  # React Flow, MIT: the map program's window (programs/map).
  '@xyflow/react': 12.12.0
  effect: 4.1.1
  electron: 45.2.1
  esbuild: 0.28.2
  fast-check: 4.10.2
  # The fabrika app's terminal (apps/fabrika). MIT, no dependencies. Held exact: it is young.
  ghostty-web: 0.4.0
  # The markdown program's reader (programs/markdown): micromark, the CommonMark parser remark
  # uses, with GitHub's tables, into mdast. MIT. No HTML is made: the window draws the tree itself.
  '@types/mdast': 4.0.4
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm: 3.1.0
  micromark-extension-gfm: 3.0.0
  miniflare: 4.20260730.0
  playwright: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  # Experiment 142: libghostty-vt on WebGPU. MIT.
  restty: 0.3.0
  smol-toml: 1.9.1
  typescript: 7.0.2
  vitest: 5.0.5
  # The YAML parser oxlint-plugins/exact-versions.ts reads this file with. vite's optional peer, so already in the lockfile.
  yaml: 2.9.1
  zod: 4.6.7

# `pnpm add` writes the exact version, not a range (docs/direction/pin-exact-versions.md).
savePrefix: ''

allowBuilds:
  esbuild: true
  workerd: true

# The platform layer's shared part, held at effect's own version: its newer releases ask for a newer effect.
overrides:
  '@effect/platform-node-shared': 4.1.1

patchedDependencies:
  # effect 4.1 deleted effect/Crypto, which alchemy 2.0.0-beta.84 imports, so its Cloudflare
  # package cannot load. The patch is the fix alchemy already merged
  # (https://github.com/alchemy-run/alchemy/pull/2754), on the built files. Drop it at the next beta.
  alchemy@2.0.0-beta.84: patches/alchemy@2.0.0-beta.84.patch
  # Manti's type files name each relative import without its `.js`, which only a bundler's
  # resolution finds; under our NodeNext none of its parts is seen. The patch adds the `.js`
  # (`./components` becomes `./components/index.js`) and changes no code. Drop it when Manti
  # ships full paths.
  '@manti-ui/react@0.13.0': patches/@manti-ui__react@0.13.0.patch
  # Draw on change, and a hollow cursor when a tile is unfocused (experiment 142).
  ghostty-web@0.4.0: patches/ghostty-web@0.4.0.patch
