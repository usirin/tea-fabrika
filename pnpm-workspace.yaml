# packages: what other code may build on. programs: one runnable tea program each.
# docs/tutorials: a tutorial's finished files, type-checked so it cannot drift.
# apps: what a person opens, on top of everything else. Nothing imports an app.
# oxlint-plugins: this repo's own lint rules, type-checked and tested like the rest.
# next/apps: the new version's app (AGENTS.md, "Two versions, side by side"). So far its exam folder.
packages:
  - apps/*
  - packages/*
  - programs/*
  - docs/tutorials/*
  - oxlint-plugins
  - .github/ci
  # .agents: the skills and the lead's own scripts, type-checked here (ticket 486). It names no
  # dependency: its imports resolve from the root's.
  - .agents
  # next/: the new version (docs/plan/tier-1.md). Real packages, one lockfile, this catalog.
  - next/packages/*
  - next/programs/*
  - next/apps/*

catalog:
  '@agentclientprotocol/sdk': 2.2.0
  # The ledger server's deploy (packages/ledger-server), held exact: a beta, as experiments 144 and 147 ran it.
  '@alchemy.run/cloudflare': 2.0.0-beta.84
  alchemy: 2.0.0-beta.84
  '@anthropic-ai/claude-agent-sdk': 0.3.316
  # The os sandbox (packages/fabrika/src/sandbox/os.ts), held exact: 0.0.x, as experiments 127, 128 and 137 ran it.
  '@anthropic-ai/sandbox-runtime': 0.0.81
  '@demlik/code-graph': 0.15.0
  '@demlik/structure-sweep': 0.4.1
  '@demlik/tea': 0.25.0
  '@effect/opentelemetry': 4.1.2
  '@effect/platform-node': 4.1.2
  '@effect/tsgo': 0.63.0
  '@effect/vitest': 4.1.2
  # MCP's official TypeScript SDK, v2's split packages: the host serves programs as tools (@kampus/fabrika-old/mcp).
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/server': 2.4.0
  # The app's UI (apps/fabrika, programs/*/window): Manti UI, Zag.js state machines and a token
  # contract of CSS custom properties, set from our own values (docs/direction/ui-on-manti.md).
  # MIT. Held exact: 0.x, a minor can break.
  '@manti-ui/react': 0.13.0
  '@manti-ui/styles': 0.13.0
  # Lint and format (docs/direction/oxlint-and-oxfmt.md). Held exact: oxlint's JS plugins are alpha,
  # oxfmt is 0.x, and a new version can change what fires or how a file prints.
  oxfmt: 0.75.0
  oxlint: 1.90.0
  stylelint: 18.0.0
  postcss-value-parser: 4.2.0
  '@oxlint/plugins': 1.90.0
  # The React Compiler without Babel, for next/'s compile step (next/apps/fabrika/src/exam/compiler.ts,
  # docs/direction/react-compiler.md). oxc's Rust port and its parser, from oxlint's own repository.
  # Held exact: 0.x and weekly, and the port is "experimental".
  oxc-parser: 0.157.0
  oxc-transform-react: 0.157.0
  # P16's package-layout rule (oxlint-plugins/program-package-layout.ts) resolves export targets
  # and relative links with oxc's resolver, the version the lockfile already holds (0040).
  oxc-resolver: 11.24.2
  rolldown: 1.2.13
  # P16 bundles window CSS with its imports. Reuse the version already in the lockfile.
  lightningcss: 1.33.0
  # Held on the SDK's 2.x line: OpenTelemetry 3 needs api 1.10, and @effect/opentelemetry 4.1.2 asks for
  # resources below 3. On that line sdk-trace-base 2.12.0 asks for api below 1.10, so api stays 1.9.1.
  '@opentelemetry/api': 1.9.1
  '@opentelemetry/exporter-trace-otlp-http': 0.223.0
  '@opentelemetry/resources': 2.12.0
  '@opentelemetry/sdk-trace-base': 2.12.0
  # The markdown window's code colors (programs/markdown): Pierre's highlighter, its lexers in one
  # WebAssembly module. Apache-2.0, its themes MIT or Apache-2.0. Held exact: a beta.
  '@pierre/highlights': 0.3.0
  # Radix Colors, MIT: the steps the token build reads (packages/fabrika-design/src/build/tokens.ts).
  # Only that build imports it (.oxlintrc.json). Held exact: a new version changes the steps.
  '@radix-ui/colors': 3.0.0
  '@rslib/core': 1.0.5
  # The mutation step (packages/pipeline/src/stages/mutation), held exact: experiment 124 ran 10.1.1.
  '@stryker-mutator/core': 10.1.1
  '@stryker-mutator/instrumenter': 10.1.1
  '@stryker-mutator/vitest-runner': 10.1.1
  # Follows the major of the Node we run (`volta` in package.json, 26), not npm's latest. Electron's main
  # process runs its own Node, older than that (docs/direction/the-gui-is-electron-first.md).
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # wterm, Apache-2.0, a Vercel Labs experiment: rows in the DOM, libghostty's core opt-in.
  '@wterm/dom': 0.5.7
  '@wterm/ghostty': 0.5.7
  # xterm.js, MIT, VS Code's terminal, with its fit and WebGL addons.
  '@xterm/addon-fit': 0.11.0
  '@xterm/addon-webgl': 0.19.0
  '@xterm/xterm': 6.0.0
  # React Flow, MIT: the map program's window (programs/map).
  '@xyflow/react': 12.12.0
  effect: 4.1.2
  electron: 45.2.1
  esbuild: 0.28.2
  fast-check: 4.10.2
  # The fabrika app's terminal (apps/fabrika). MIT, no dependencies. Held exact: it is young.
  ghostty-web: 0.4.0
  # The markdown program's reader (programs/markdown): micromark, the CommonMark parser remark
  # uses, with GitHub's tables, into mdast. MIT. No HTML is made: the window draws the tree itself.
  '@types/mdast': 4.0.4
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm: 3.1.0
  micromark-extension-gfm: 3.0.0
  miniflare: 4.20260730.0
  playwright: 1.64.1
  react: 19.3.1
  react-dom: 19.3.1
  # Experiment 142: libghostty-vt on WebGPU. MIT.
  restty: 0.3.0
  smol-toml: 1.9.1
  typescript: 7.0.2
  vitest: 5.0.5
  # The YAML parser oxlint-plugins/exact-versions.ts reads this file with. vite's optional peer, so already in the lockfile.
  yaml: 2.9.1
  zod: 4.6.7

# `pnpm add` writes the exact version, not a range (docs/direction/pin-exact-versions.md).
savePrefix: ''

allowBuilds:
  esbuild: true
  workerd: true

# The platform layer's shared part, held at effect's own version: its newer releases ask for a newer effect.
overrides:
  '@effect/platform-node-shared': 4.1.2

patchedDependencies:
  # P12 observes workerd PIDs, exits, replacement delays and recovery stopping.
  # Keep Alchemy's existing restart policy. Drop this when Alchemy exposes the hooks
  # (https://github.com/alchemy-run/alchemy/issues/3184).
  # P16: a closed worker proxy also drops its 30-second port reservation, so a stage restarted in
  # the same process can bind its fixed port again
  # (https://github.com/alchemy-run/alchemy/issues/3188, closed as completed). Drop that part at
  # the release that carries the fix.
  '@alchemy.run/cloudflare-runtime@2.0.0-beta.84': patches/@alchemy.run__cloudflare-runtime@2.0.0-beta.84.patch
  # demlik#897: expose the machine's existing schemas; drop at the release that has it.
  '@demlik/tea@0.25.0': patches/@demlik__tea@0.25.0.patch
  # effect 4.1 deleted effect/Crypto, which alchemy 2.0.0-beta.84 imports, so its Cloudflare
  # package cannot load. The patch is the fix alchemy already merged
  # (https://github.com/alchemy-run/alchemy/pull/2754), on the built files. Drop it at the next beta.
  alchemy@2.0.0-beta.84: patches/alchemy@2.0.0-beta.84.patch
  # Effect-TS/effect: issue to come (ticket 618). A Schema string's shrink candidates are built on the
  # first shrink, not while generating (sampleFromValidatedShrink already is). Drop at the release that has it.
  effect@4.1.2: patches/effect@4.1.2.patch
  # Manti's type files name each relative import without its `.js`, which only a bundler's
  # resolution finds; under our NodeNext none of its parts is seen. The patch adds the `.js`
  # (`./components` becomes `./components/index.js`) and changes no code. Drop it when Manti
  # ships full paths.
  '@manti-ui/react@0.13.0': patches/@manti-ui__react@0.13.0.patch
  # Draw on change, and a hollow cursor when a tile is unfocused (experiment 142).
  ghostty-web@0.4.0: patches/ghostty-web@0.4.0.patch
  # demlik#905: a non-exported const beside an exported type of its name is not an unused export;
  # drop at the release that has the fix.
  '@demlik/code-graph@0.15.0': patches/@demlik__code-graph@0.15.0.patch
  # Alchemy's prebuilt-bundle watcher serves again on every watch event, changed or not. macOS
  # reports a late event for a folder made just before the watch began, so a Mac replaced the
  # brain's workerd soon after a start, and after the three-replacement brake too. The patch
  # passes on only a bundle whose hash differs. Drop this when Alchemy compares the bundle
  # before it serves again (https://github.com/alchemy-run/alchemy/issues/3214).
  '@alchemy.run/cloudflare@2.0.0-beta.84': patches/@alchemy.run__cloudflare@2.0.0-beta.84.patch

minimumReleaseAgeExclude:
  - '@demlik/tea@0.24.0 || 0.25.0'
  - '@demlik/code-graph@0.15.0'
