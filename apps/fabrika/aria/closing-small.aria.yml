- banner:
  - navigation "workspaces":
    - button "1 tsh"
    - button "2 tsh"
    - 'button "3 #1"'
    - 'button "4 #1"'
    - 'button "5 #1"'
    - 'button "6 #1"'
  - navigation "the line":
    - button "tracker"
    - text: "|"
    - button "ticket"
  - status "the link to the host":
    - button "host up"
- region "tile t14, tracker, a window of the line typed in t14":
  - text: tracker t14
  - textbox "Terminal input":
    - textbox "Terminal input"
  - region "t14 screen": tsh$ tracker | ticket ticket 1
  - main "tracker view":
    - region "tracker":
      - button "← Tickets"
      - text: Esc
      - heading "The tree, read" [level=2]
      - paragraph:
        - img "open"
        - text: "Open #1 next: triage"
      - list "timeline":
        - listitem:
          - paragraph:
            - text: owner filed it
            - time: <time>
      - form "comment":
        - textbox "comment":
          - /placeholder: Leave a comment
        - text: Ctrl Enter comments
        - button "Close ticket"
        - button "Request changes" [disabled]
        - button "Comment" [disabled]
- separator
- region "tile t18, ticket, a window of the line typed in t14":
  - text: "ticket #1 t18"
  - main "ticket view":
    - text: "#1 filed by owner, <time>"
    - heading "The tree, read" [level=1]
    - region "Whose turn": "Next: triage Nothing waits on you."
    - region "Properties":
      - term: Status
      - definition: "next: triage"
      - term: Filed by
      - definition: owner
      - term: Step
      - definition: none running
      - term: Plan
      - definition: none yet
      - term: PR
      - definition: none yet
      - term: Checks
      - definition: no PR yet
      - term: Cost
      - definition: $0.00
      - term: Trace
      - definition:
        - code: trace --ticket 1
    - paragraph: No description.
    - region "Activity":
      - heading "Activity" [level=2]
      - text: 1 J K move ↵ open
      - list:
        - listitem:
          - button "owner filed it <time>":
            - text: owner filed it
            - time: <time>
      - text: Leave a comment
      - textbox "Leave a comment"
      - text: ⌘ ↵ to send
      - button "Request changes" [disabled]
      - button "Comment" [disabled]
- separator
- region "tile t16":
  - text: tsh t16
  - textbox "Terminal input":
    - textbox "Terminal input"
  - region "t16 screen": tsh$
- separator
- region "tile t15":
  - text: tsh t15
  - textbox "Terminal input":
    - textbox "Terminal input"
  - region "t15 screen": tsh$
- separator
- region "tile t17, closing":
  - text: tsh closing t17
  - textbox "Terminal input":
    - textbox "Terminal input"
  - region "t17 screen": tsh$ sleep --ms 600000 & [9] sleep:<id> tsh$
- contentinfo:
  - text: t17 tsh·
  - button "%9 sleep --ms 600000 <time>"
  - button "C-b i info"
  - text: ·
  - button "C-b ? keys"
- status: Info mode off.
