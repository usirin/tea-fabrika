    - textbox "Terminal input"
  - region "t20 screen": tsh$
- separator
- region "tile t19, ticket, a window of the line typed in t18":
  - text: "ticket #7 t19"
  - main "ticket view":
    - text: "#7 filed by owner, <time>"
    - heading "fabrika post prints the ticket number twice" [level=1]
    - region "Whose turn":
      - text: Your turn · approve plan v1 lane (an agent) asked at 00:232 tasks
      - button "No"
      - button "Approve plan v1"
    - region "Properties":
      - term: Status
      - definition: waits on you
      - term: Filed by
      - definition: owner
      - term: Step
      - definition: approval
      - term: Plan
      - definition: v1 2 tasks
      - term: PR
      - definition: none yet
      - term: Checks
      - definition: no PR yet
      - term: Cost
      - definition: $0.49
      - term: Trace
      - definition:
        - code: trace --ticket 7
    - paragraph: "Every line fabrika post list prints names the ticket number twice, like #9 open c28 #9 The ledger moves to Cloudflare. It should name it once."
    - paragraph: Done when every line names its number exactly once, and the rest of the line does not change.
    - region "Activity":
      - heading "Activity" [level=2]
      - text: 7 J K move ↵ open
      - list:
        - listitem:
          - button "owner filed it <time>":
            - text: owner filed it
            - time: <time>
        - listitem:
          - button "lane (an agent) triage started <time>":
            - text: lane (an agent) triage started
            - time: <time>
        - listitem:
          - 'button "lane (an agent) triage: sent to plan: yes $0.11, 1 turn <time>"':
            - text: "lane (an agent) triage: sent to plan: yes $0.11, 1 turn"
            - time: <time>
        - listitem:
          - button "lane (an agent) plan started <time>":
            - text: lane (an agent) plan started
            - time: <time>
        - listitem:
          - 'button "lane (an agent) plan: done $0.38, 9 turns <time>"':
            - text: "lane (an agent) plan: done $0.38, 9 turns"
            - time: <time>
        - listitem:
          - button "lane (an agent) plan v1 2 tasks <time>":
            - text: lane (an agent) plan v1 2 tasks
            - time: <time>
        - listitem:
          - 'button "lane (an agent) asks you: approve plan v1 approve / no <time>"':
            - text: "lane (an agent) asks you: approve plan v1 approve / no"
            - time: <time>
      - text: Leave a comment
      - textbox "Leave a comment"
      - text: ⌘ ↵ to send
      - button "Request changes" [disabled]
      - button "Comment" [disabled]
