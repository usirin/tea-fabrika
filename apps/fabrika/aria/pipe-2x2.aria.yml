- banner:
  - navigation "workspaces":
    - button "1 tsh"
    - 'button "2 #7"'
    - button "3 tsh"
    - 'button "4 #7"'
    - button "5 tsh"
    - 'button "6 #7"'
    - button "7 tsh"
    - 'button "8 #7"'
  - navigation "the line":
    - button "tracker"
    - text: "|"
    - button "ticket"
  - button "1 asks you 1 not seen":
    - text: 1 asks you
    - img "1 not seen"
  - text: ·
  - status "the link to the host":
    - button "host up"
- region "tile t18, tracker, a window of the line typed in t18":
  - text: tracker t18
  - textbox "Terminal input":
    - textbox "Terminal input"
  - region "t18 screen": tsh$ tracker | ticket ticket 7
  - main "tracker view":
    - region "tracker":
      - button "← Tickets"
      - text: Esc
      - 'heading "`fabrika post` prints the ticket number twice" [level=2]'
      - paragraph:
        - img "open"
        - text: "Open #7 waits on you: approve plan v1"
      - list "timeline":
        - listitem:
          - paragraph:
            - text: owner filed it
            - time: <time>
          - text: "Every line `fabrika post list` prints names the ticket number twice, like `#9 open c28 #9 The ledger moves to Cloudflare`. It should name it once. Done when every line names its number exactly once, and the rest of the line does not change."
        - listitem:
          - paragraph:
            - text: lane,owner's agent triage started
            - time: <time>
        - listitem:
          - paragraph:
            - text: "lane,owner's agent triage: sent to plan: yes $0.11, 1 turn"
            - time: <time>
        - listitem:
          - paragraph:
            - text: lane,owner's agent plan started
            - time: <time>
        - listitem:
          - paragraph:
            - text: "lane,owner's agent plan: done $0.38, 9 turns"
            - time: <time>
        - listitem:
          - paragraph:
            - text: lane,owner's agent plan v1 2 tasks
            - time: <time>
        - listitem:
          - paragraph:
            - text: "lane,owner's agent asks you: approve plan v1 approve / no"
            - time: <time>
      - 'region "ask: approve plan v1"':
        - paragraph:
          - text: lane,owner's agent asks you
          - time: <time>
        - paragraph: approve plan v1
        - textbox "note with the answer":
          - /placeholder: A note with your answer, if it needs one
        - button "approve"
        - button "no"
      - form "comment":
        - textbox "comment":
          - /placeholder: Leave a comment
        - text: Ctrl Enter comments
        - button "Close ticket"
        - button "Request changes" [disabled]
        - button "Comment" [disabled]
- separator
