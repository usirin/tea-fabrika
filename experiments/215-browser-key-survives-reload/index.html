<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Experiment 215: a browser key in IndexedDB</title>
	</head>
	<body>
		<p>Experiment 215. The script drives this page through <code>window.exp215</code>.</p>
		<script>
			// One IndexedDB database, one store, one row: the tab's key pair as WebCrypto made it.
			const DB = "exp215";
			const STORE = "keys";
			const ID = "tab";

			const open = () =>
				new Promise((resolve, reject) => {
					const req = indexedDB.open(DB, 1);
					req.onupgradeneeded = () => req.result.createObjectStore(STORE);
					req.onsuccess = () => resolve(req.result);
					req.onerror = () => reject(req.error);
				});

			const run = (mode, act) =>
				open().then(
					(db) =>
						new Promise((resolve, reject) => {
							const tx = db.transaction(STORE, mode);
							const req = act(tx.objectStore(STORE));
							tx.oncomplete = () => {
								db.close();
								resolve(req.result);
							};
							tx.onerror = () => reject(tx.error);
						}),
				);

			const hex = (buf) =>
				[...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");

			const fingerprint = async (pair) => {
				const raw = await crypto.subtle.exportKey("raw", pair.publicKey);
				return hex(await crypto.subtle.digest("SHA-256", raw));
			};

			// Never returns the private key's bytes: only names, flags and a public fingerprint.
			window.exp215 = {
				page: () => ({secure: isSecureContext, origin: location.origin, ua: navigator.userAgent}),
				storage: async () => ({persisted: await navigator.storage.persisted()}),
				// Make a key if none is kept; say whether it was made now.
				ensure: async () => {
					let pair = await run("readonly", (s) => s.get(ID));
					const made = !pair;
					if (made) {
						pair = await crypto.subtle.generateKey({name: "Ed25519"}, false, ["sign", "verify"]);
						await run("readwrite", (s) => s.put(pair, ID));
					}
					return {
						made,
						fingerprint: await fingerprint(pair),
						extractable: pair.privateKey.extractable,
						type: pair.privateKey.type,
						algorithm: pair.privateKey.algorithm.name,
						usages: pair.privateKey.usages,
					};
				},
				// Is a key kept, without making one?
				peek: async () => {
					const pair = await run("readonly", (s) => s.get(ID));
					return pair ? {kept: true, fingerprint: await fingerprint(pair)} : {kept: false};
				},
				// Sign a fresh text with the kept key and check it with the kept public key.
				sign: async (text) => {
					const pair = await run("readonly", (s) => s.get(ID));
					if (!pair) return {kept: false};
					const data = new TextEncoder().encode(text);
					const sig = await crypto.subtle.sign({name: "Ed25519"}, pair.privateKey, data);
					const ok = await crypto.subtle.verify({name: "Ed25519"}, pair.publicKey, sig, data);
					return {kept: true, bytes: sig.byteLength, ok};
				},
				// Try every way out for the private key; each must reject.
				tryExport: async () => {
					const pair = await run("readonly", (s) => s.get(ID));
					if (!pair) return {kept: false};
					const out = {kept: true};
					for (const format of ["pkcs8", "jwk", "raw"]) {
						try {
							await crypto.subtle.exportKey(format, pair.privateKey);
							out[format] = "exported";
						} catch (e) {
							out[format] = e.name;
						}
					}
					// wrapKey is the other way out: it exports, then encrypts.
					const wrapper = await crypto.subtle.generateKey({name: "AES-GCM", length: 256}, false, [
						"wrapKey",
					]);
					try {
						await crypto.subtle.wrapKey("pkcs8", pair.privateKey, wrapper, {
							name: "AES-GCM",
							iv: new Uint8Array(12),
						});
						out.wrap = "wrapped";
					} catch (e) {
						out.wrap = e.name;
					}
					return out;
				},
			};
		</script>
	</body>
</html>
